backend:
  name: github
  repo: shawnyudi888/laysun.3.1
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

# 媒体文件配置
media_folder: "public/uploads"
public_folder: "/uploads"
site_url: https://www.laysun.co
display_url: https://www.laysun.co
logo_url: https://www.laysun.co/logo.svg

# 编辑器配置
editor:
  preview: true

# 搜索配置
search: true

# ==================== 内容集合配置 ====================

collections:
  # ==================== 1. 项目/产品 ====================
  - name: "projects"
    label: "🏗️ Projects / 项目"
    label_singular: "Project / 项目"
    description: "管理所有项目和产品展示内容"
    folder: "src/content/projects"
    create: true
    delete: true
    slug: "{{slug}}"
    preview_path: "projects/{{slug}}"
    sortable_fields: ['publishDate', 'title', 'category']
    view_filters:
      - label: "已发布"
        field: status
        pattern: "published"
      - label: "草稿"
        field: status
        pattern: "draft"
      - label: "Systems"
        field: category
        pattern: "systems"
      - label: "Manufacturing"
        field: category
        pattern: "manufacturing"
      - label: "Projects"
        field: category
        pattern: "projects"
    
    fields:
      # --- 基础信息 ---
      - label: "📋 Basic Info / 基础信息"
        name: "basic"
        widget: "object"
        collapsed: false
        fields:
          - label: "Status / 发布状态"
            name: "status"
            widget: "select"
            options:
              - { label: "🟢 Published / 已发布", value: "published" }
              - { label: "🟡 Draft / 草稿", value: "draft" }
              - { label: "🔴 Archived / 归档", value: "archived" }
            default: "draft"
          
          - label: "Publish Date / 发布日期"
            name: "publishDate"
            widget: "datetime"
            date_format: "YYYY-MM-DD"
            time_format: "HH:mm"
            format: "YYYY-MM-DDTHH:mm:ssZ"
            default: "{{now}}"
          
          - label: "Title / 项目名称"
            name: "title"
            widget: "string"
            required: true
            hint: "显示在页面标题和列表中"
          
          - label: "Slug / URL 路径"
            name: "slug"
            widget: "string"
            required: true
            pattern: ['^[a-z0-9-]+$', "只能使用小写字母、数字和连字符"]
            hint: "例如：vertical-farming-system → /projects/vertical-farming-system"
          
          - label: "Category / 分类"
            name: "category"
            widget: "relation"
            collection: "categories"
            search_fields: ["name"]
            value_field: "slug"
            display_fields: ["name", "slug"]
            required: true

      # --- 封面与媒体 ---
      - label: "🖼️ Media / 媒体"
        name: "media"
        widget: "object"
        collapsed: true
        fields:
          - label: "Cover Image / 封面图"
            name: "coverImage"
            widget: "image"
            required: true
            hint: "建议尺寸 1200x800px，用于项目卡片和详情页头部"
            media_library:
              config:
                multiple: false
          
          - label: "Hero Image / 主视觉图"
            name: "heroImage"
            widget: "image"
            required: false
            hint: "详情页顶部大图（可选，默认使用封面图）"
          
          - label: "Gallery / 图片集"
            name: "gallery"
            widget: "list"
            label_singular: "Image / 图片"
            field: 
              label: "Image"
              name: "image"
              widget: "image"
            hint: "项目详情页展示的多张图片，支持拖拽排序"
          
          - label: "Video URL / 视频链接"
            name: "videoUrl"
            widget: "string"
            required: false
            hint: "YouTube 或 Vimeo 链接（可选）"

      # --- 内容描述 ---
      - label: "📝 Content / 内容"
        name: "content"
        widget: "object"
        collapsed: false
        fields:
          - label: "Summary / 简短描述"
            name: "summary"
            widget: "text"
            required: true
            hint: "显示在项目卡片上，建议 100-150 字"
          
          - label: "Description / 详细描述"
            name: "description"
            widget: "markdown"
            required: true
            buttons:
              - bold
              - italic
              - link
              - heading-two
              - heading-three
              - quote
              - bulleted-list
              - numbered-list
              - image
            hint: "支持 Markdown 格式的详细内容"

      # --- 产品特点 ---
      - label: "✨ Features / 产品特点"
        name: "features"
        widget: "list"
        label_singular: "Feature / 特点"
        collapsed: true
        fields:
          - label: "Icon / 图标"
            name: "icon"
            widget: "select"
            options:
              - { label: "⚡ 高效", value: "zap" }
              - { label: "🌱 环保", value: "leaf" }
              - { label: "🔧 可定制", value: "settings" }
              - { label: "📊 数据", value: "bar-chart" }
              - { label: "🛡️ 安全", value: "shield" }
              - { label: "🔄 自动化", value: "refresh-cw" }
              - { label: "💡 创新", value: "lightbulb" }
              - { label: "🌍 全球", value: "globe" }
            default: "zap"
            required: false
          
          - label: "Title / 标题"
            name: "title"
            widget: "string"
            required: true
          
          - label: "Description / 描述"
            name: "description"
            widget: "text"
            required: true
        hint: "列出产品的核心卖点和优势"

      # --- 技术规格 ---
      - label: "📐 Specifications / 技术规格"
        name: "specifications"
        widget: "list"
        label_singular: "Spec / 规格项"
        collapsed: true
        fields:
          - label: "Key / 参数名"
            name: "key"
            widget: "string"
            required: true
          
          - label: "Value / 参数值"
            name: "value"
            widget: "string"
            required: true
          
          - label: "Unit / 单位"
            name: "unit"
            widget: "string"
            required: false
            hint: "例如：m², kg, kW"
        hint: "产品的技术参数表格"

      # --- 关联内容 ---
      - label: "🔗 Related / 关联内容"
        name: "related"
        widget: "object"
        collapsed: true
        fields:
          - label: "Related Projects / 关联项目"
            name: "relatedProjects"
            widget: "relation"
            collection: "projects"
            search_fields: ["title"]
            value_field: "slug"
            display_fields: ["title", "category"]
            multiple: true
            required: false
            hint: "选择相关的其他项目"
          
          - label: "Tags / 标签"
            name: "tags"
            widget: "list"
            label_singular: "Tag / 标签"
            field: { label: "Tag", name: "tag", widget: "string" }
            hint: "用于搜索和筛选，例如：indoor, vertical, automated"

      # --- SEO 设置 ---
      - label: "🔍 SEO / 搜索引擎优化"
        name: "seo"
        widget: "object"
        collapsed: true
        fields:
          - label: "Meta Title / 页面标题"
            name: "metaTitle"
            widget: "string"
            required: false
            hint: "浏览器标签页标题（默认使用项目名称）"
          
          - label: "Meta Description / 页面描述"
            name: "metaDescription"
            widget: "text"
            required: false
            hint: "搜索引擎结果中显示的描述"
          
          - label: "Keywords / 关键词"
            name: "keywords"
            widget: "list"
            label_singular: "Keyword / 关键词"
            field: { label: "Keyword", name: "keyword", widget: "string" }

  # ==================== 2. 分类管理 ====================
  - name: "categories"
    label: "📂 Categories / 分类"
    label_singular: "Category / 分类"
    description: "管理项目分类"
    folder: "src/content/categories"
    create: true
    delete: true
    slug: "{{slug}}"
    preview_path: "category/{{slug}}"
    
    fields:
      - label: "Name / 分类名称"
        name: "name"
        widget: "string"
        required: true
      
      - label: "Slug / URL 路径"
        name: "slug"
        widget: "string"
        required: true
        pattern: ['^[a-z0-9-]+$', "只能使用小写字母、数字和连字符"]
      
      - label: "Description / 描述"
        name: "description"
        widget: "text"
        required: true
        hint: "分类页面的描述文字"
      
      - label: "Icon / 图标"
        name: "icon"
        widget: "image"
        required: false
        hint: "分类图标（建议 64x64px）"
      
      - label: "Color / 主题色"
        name: "color"
        widget: "color"
        required: false
        default: "#10B981"
        hint: "分类的主题颜色"
      
      - label: "Order / 排序"
        name: "order"
        widget: "number"
        default: 0
        hint: "数字越小排序越靠前"

  # ==================== 3. 页面内容 ====================
  - name: "pages"
    label: "📄 Pages / 页面"
    description: "管理网站页面内容"
    files:
      # --- 首页 ---
      - label: "🏠 Home / 首页"
        name: "home"
        file: "src/content/pages/home.json"
        fields:
          - label: "Hero Section / 主视觉区"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Title / 标题", name: "title", widget: "string" }
              - { label: "Subtitle / 副标题", name: "subtitle", widget: "text" }
              - { label: "Background Image / 背景图", name: "backgroundImage", widget: "image" }
              - { label: "CTA Text / 按钮文字", name: "ctaText", widget: "string", default: "View Projects" }
              - { label: "CTA Link / 按钮链接", name: "ctaLink", widget: "string", default: "/projects" }
          
          - label: "Featured Projects / 精选项目"
            name: "featuredProjects"
            widget: "relation"
            collection: "projects"
            search_fields: ["title"]
            value_field: "slug"
            display_fields: ["title", "category"]
            multiple: true
            hint: "首页展示的项目（最多 6 个）"
          
          - label: "About Section / 关于我们"
            name: "about"
            widget: "object"
            fields:
              - { label: "Title / 标题", name: "title", widget: "string" }
              - { label: "Content / 内容", name: "content", widget: "markdown" }
              - { label: "Image / 图片", name: "image", widget: "image" }

      # --- 关于页面 ---
      - label: "ℹ️ About / 关于我们"
        name: "about"
        file: "src/content/pages/about.json"
        fields:
          - { label: "Title / 页面标题", name: "title", widget: "string" }
          - { label: "Content / 内容", name: "content", widget: "markdown" }
          - label: "Team / 团队"
            name: "team"
            widget: "list"
            fields:
              - { label: "Name / 姓名", name: "name", widget: "string" }
              - { label: "Role / 职位", name: "role", widget: "string" }
              - { label: "Photo / 照片", name: "photo", widget: "image" }
              - { label: "Bio / 简介", name: "bio", widget: "text" }

      # --- 联系页面 ---
      - label: "📞 Contact / 联系我们"
        name: "contact"
        file: "src/content/pages/contact.json"
        fields:
          - { label: "Title / 页面标题", name: "title", widget: "string" }
          - { label: "Description / 描述", name: "description", widget: "text" }
          - label: "Contact Info / 联系信息"
            name: "contactInfo"
            widget: "object"
            fields:
              - { label: "Address / 地址", name: "address", widget: "text" }
              - { label: "Phone / 电话", name: "phone", widget: "string" }
              - { label: "Email / 邮箱", name: "email", widget: "string" }
              - { label: "Map URL / 地图链接", name: "mapUrl", widget: "string" }

  # ==================== 4. 全局设置 ====================
  - name: "settings"
    label: "⚙️ Settings / 全局设置"
    description: "网站全局配置"
    files:
      - label: "🌐 Site Settings / 网站设置"
        name: "site"
        file: "src/content/settings/site.json"
        fields:
          - { label: "Site Name / 网站名称", name: "siteName", widget: "string", default: "LAYSUN" }
          - { label: "Site Description / 网站描述", name: "siteDescription", widget: "text" }
          - { label: "Logo / 网站 Logo", name: "logo", widget: "image" }
          - { label: "Favicon / 网站图标", name: "favicon", widget: "image" }
          
          - label: "Social Links / 社交媒体"
            name: "social"
            widget: "object"
            fields:
              - { label: "LinkedIn", name: "linkedin", widget: "string", required: false }
              - { label: "Twitter", name: "twitter", widget: "string", required: false }
              - { label: "Instagram", name: "instagram", widget: "string", required: false }
              - { label: "YouTube", name: "youtube", widget: "string", required: false }
          
          - label: "Footer / 页脚"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Copyright / 版权信息", name: "copyright", widget: "string" }
              - { label: "Links / 链接", name: "links", widget: "markdown" }
