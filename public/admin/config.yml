backend:
  name: git-gateway
  repo: shawnyudi888/laysun.3.1
  branch: main

# 或者使用测试模式
local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"
site_url: https://www.laysun.co

collections:
  - name: "projects"
    label: "Projects"
    folder: "src/content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }
