backend:
  name: github
  repo: shawnyudi888/laysun.3.1
  branch: main
  base_url: https://www.laysun.co
  auth_endpoint: api/auth

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

site_url: https://www.laysun.co

collections:
  - name: "blog"
    label: "博客文章"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "发布日期", name: "date", widget: "datetime" }
      - { label: "封面图", name: "thumbnail", widget: "image", required: false }
      - { label: "摘要", name: "summary", widget: "text", required: false }
      - { label: "正文", name: "body", widget: "markdown" }

  - name: "pages"
    label: "页面"
    folder: "content/pages"
    create: true
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "路径", name: "slug", widget: "string" }
      - { label: "正文", name: "body", widget: "markdown" }
