backend:
  name: github
  repo: shawnyudi888/laysun.3.1
  branch: main
  base_url: https://www.laysun.co
  auth_endpoint: /api/auth

media_folder: "public/uploads"
public_folder: "/uploads"
site_url: https://www.laysun.co
logo_url: https://www.laysun.co/logo.svg

editor:
  preview: true

search: true

collections:
  # ==================== 1. 项目/产品 ====================
  - name: "projects"
    label: "🏗️ Projects / 项目"
    label_singular: "Project / 项目"
    description: "管理所有项目和产品展示内容"
    folder: "src/content/projects"
    create: true
    delete: true
    slug: "{{slug}}"
    preview_path: "projects/{{slug}}"
    sortable_fields: ['publishDate', 'title', 'category']
    view_filters:
      - label: "已发布"
        field: status
        pattern: "published"
      - label: "草稿"
        field: status
        pattern: "draft"
      - label: "Systems"
        field: category
        pattern: "systems"
      - label: "Manufacturing"
        field: category
        pattern: "manufacturing"
      - label: "Projects"
        field: category
        pattern: "projects"
    
    fields:
      # --- 基础信息 ---
      - label: "📋 Basic Info / 基础信息"
        name: "basic"
        widget: "object"
        collapsed: false
        fields:
          - label: "Status / 发布状态"
            name: "status"
            widget: "select"
            options:
              - { label: "🟢 Published / 已发布", value: "published" }
              - { label: "🟡 Draft / 草稿", value: "draft" }
              - { label: "🔴 Archived / 归档", value: "archived" }
            default: "draft"
          
          - label: "Publish Date / 发布日期"
            name: "publishDate"
            widget: "datetime"
            date_format: "YYYY-MM-DD"
            time_format: "HH:mm"
            format: "YYYY-MM-DDTHH:mm:ssZ"
            default: "{{now}}"
          
          - label: "Title / 项目名称"
            name: "title"
            widget: "string"
            required: true
          
          - label: "Slug / URL 路径"
            name: "slug"
            widget: "string"
            required: true
            pattern: ['^[a-z0-9-]+$', "只能使用小写字母、数字和连字符"]
          
          - label: "Category / 分类"
            name: "category"
            widget: "select"
            options:
              - { label: "Systems / 系统", value: "systems" }
              - { label: "Manufacturing / 制造", value: "manufacturing" }
              - { label: "Projects / 项目案例", value: "projects" }
            required: true

      # --- 封面与媒体 ---
      - label: "🖼️ Media / 媒体"
        name: "media"
        widget: "object"
        collapsed: true
        fields:
          - label: "Cover Image / 封面图"
            name: "coverImage"
            widget: "image"
            required: true
          
          - label: "Hero Image / 主视觉图"
            name: "heroImage"
            widget: "image"
            required: false
          
          - label: "Gallery / 图片集"
            name: "gallery"
            widget: "list"
            label_singular: "Image / 图片"
            field: 
              label: "Image"
              name: "image"
              widget: "image"

      # --- 内容描述 ---
      - label: "📝 Content / 内容"
        name: "content"
        widget: "object"
        collapsed: false
        fields:
          - label: "Summary / 简短描述"
            name: "summary"
            widget: "text"
            required: true
          
          - label: "Description / 详细描述"
            name: "description"
            widget: "markdown"
            required: true
            buttons:
              - bold
              - italic
              - link
              - heading-two
              - heading-three
              - quote
              - bulleted-list
              - numbered-list

      # --- 产品特点 ---
      - label: "✨ Features / 产品特点"
        name: "features"
        widget: "list"
        label_singular: "Feature / 特点"
        collapsed: true
        fields:
          - label: "Title / 标题"
            name: "title"
            widget: "string"
            required: true
          
          - label: "Description / 描述"
            name: "description"
            widget: "text"
            required: true

      # --- 技术规格 ---
      - label: "📐 Specifications / 技术规格"
        name: "specifications"
        widget: "list"
        label_singular: "Spec / 规格项"
        collapsed: true
        fields:
          - label: "Key / 参数名"
            name: "key"
            widget: "string"
            required: true
          
          - label: "Value / 参数值"
            name: "value"
            widget: "string"
            required: true

  # ==================== 2. 页面内容 ====================
  - name: "pages"
    label: "📄 Pages / 页面"
    files:
      - label: "🏠 Home / 首页"
        name: "home"
        file: "src/content/pages/home.json"
        fields:
          - label: "Hero Title"
            name: "heroTitle"
            widget: "string"
          - label: "Hero Subtitle"
            name: "heroSubtitle"
            widget: "text"
          - label: "Featured Projects"
            name: "featuredProjects"
            widget: "relation"
            collection: "projects"
            search_fields: ["title"]
            value_field: "slug"
            display_fields: ["title"]
            multiple: true
