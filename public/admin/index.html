<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager</title>
  <!-- 重点：引入 Decap CMS 的脚本 -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</head>
<body>
  <!-- 这个脚本是为了让 CMS 能够正确识别你的身份验证端点 -->
  <script>
    // 确保 CMS 知道我们的认证端点不是默认的 OAuth，而是我们自己的 /api/auth
    window.CMS = window.CMS || {};
    window.CMS.init = {
      load_config_file: false, // 告诉 CMS 从全局变量获取配置，而不是加载 config.yml（因为我们已经在页面中配置了）
      backend: {
        name: 'github',
        repo: '你的GitHub用户名/laysun-website', // 再次确认这里的仓库名是否正确
        branch: 'main',
        base_url: 'https://www.laysun.co',
        auth_endpoint: 'api/auth' // 明确指定认证端点
      }
    };
  </script>
  <!-- 这个 div 是 CMS 挂载的根节点 -->
  <div id="root"></div>
</body>
</html>
