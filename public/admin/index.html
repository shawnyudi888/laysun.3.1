<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager | LAYSUN</title>
  <style>
    /* 给个背景色，避免加载瞬间白屏 */
    body { background-color: #f5f5f5; margin: 0; }
  </style>
</head>
<body>
  <!-- 定义 CMS 挂载的根节点 -->
  <div id="root"></div>

  <!-- 这个脚本是为了让 CMS 能够正确识别你的身份验证端点 -->
  <script>
    window.CMS = window.CMS || {};
    window.CMS.init = {
      backend: {
        name: 'github',
        repo: 'shawnyudi888/laysun.3.1',
        branch: 'main',
        base_url: 'https://www.laysun.co',
        auth_endpoint: 'api/auth'
      },
      // 添加本地后端配置，避免不必要的请求
      local_backend: false,
      // 加载配置文件的路径
      config: {
        load_config_file: true,
        config_file: '/admin/config.yml'
      }
    };
  </script>

  <!-- 将脚本放在 body 底部，并添加 defer 确保在 DOM 加载后执行 -->
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.0.0/dist/decap-cms.js" defer></script>

  <!-- 可选：加载失败时的备用方案 -->
  <script>
    // 检查 CMS 是否成功加载
    setTimeout(function() {
      if (!document.getElementById('root')?.children?.length) {
        console.log('CMS 加载较慢，请稍候...');
        // 可以在这里显示一个加载提示
      }
    }, 3000);
  </script>
</body>
</html>
