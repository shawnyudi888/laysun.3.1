<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager | LAYSUN</title>
  <style>
    body { background-color: #f5f5f5; margin: 0; }
  </style>
</head>
<body>
  <!-- 定义 CMS 挂载的根节点 -->
  <div id="root"></div>

  <script>
    window.CMS = window.CMS || {};
    window.CMS.init = {
      // 直接使用 token 认证，不跳转 OAuth
      backend: {
        name: 'github',
        repo: 'shawnyudi888/laysun.3.1',
        branch: 'main',
        base_url: 'https://www.laysun.co',
        auth_endpoint: 'api/auth',
        // 关键：告诉 CMS 我们已经有了 token，不需要 OAuth 跳转
        auth_type: 'implicit'
      },
      // 加载配置文件
      config: {
        load_config_file: true,
        config_file: '/admin/config.yml'
      },
      // 本地后端关闭
      local_backend: false
    };
  </script>

  <!-- 加载 CMS 脚本 -->
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.0.0/dist/decap-cms.js" defer></script>
</body>
</html>
