<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager | LAYSUN</title>
</head>
<body>
  <!-- 先定义CMS配置，再加载脚本 -->
  <script>
    window.CMS_MANUAL_INIT = true;
    window.CMS_CONFIG = {
      backend: {
        name: 'github',
        repo: 'shawnyudi888/laysun.3.1',
        branch: 'main',
        base_url: 'https://www.laysun.co',
        auth_endpoint: 'api/auth',
        auth_type: 'implicit'  // 关键：告诉CMS直接用token，不跳转
      },
      media_folder: 'public/uploads',
      public_folder: '/uploads',
      collections: [
        {
          name: 'projects',
          label: 'Projects / 项目',
          folder: 'content/projects',
          create: true,
          slug: '{{slug}}',
          fields: [
            { label: '标题', name: 'title', widget: 'string' },
            { label: '发布日期', name: 'date', widget: 'datetime' },
            { label: '封面图片', name: 'image', widget: 'image' },
            { label: '简介', name: 'description', widget: 'text' },
            { label: '详细内容', name: 'body', widget: 'markdown' },
            { label: '项目链接', name: 'link', widget: 'string', required: false },
            { label: '排序权重', name: 'weight', widget: 'number', value_type: 'int', default: 0 }
          ]
        },
        {
          name: 'categories',
          label: 'Categories / 分类',
          folder: 'content/categories',
          create: true,
          slug: '{{slug}}',
          fields: [
            { label: '分类名称', name: 'title', widget: 'string' },
            { label: '描述', name: 'description', widget: 'text', required: false }
          ]
        },
        {
          name: 'pages',
          label: 'Pages / 独立页面',
          folder: 'content/pages',
          create: true,
          slug: '{{slug}}',
          fields: [
            { label: '页面标题', name: 'title', widget: 'string' },
            { label: '内容', name: 'body', widget: 'markdown' },
            { label: '显示在导航', name: 'show_in_nav', widget: 'boolean', default: true },
            { label: '导航排序', name: 'nav_order', widget: 'number', required: false }
          ]
        }
      ]
    };
  </script>
  <!-- 加载CMS脚本 -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
